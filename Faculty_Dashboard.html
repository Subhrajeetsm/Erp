<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard - ESTCampus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f9fa;
    }
    header {
      background: #007bff;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 {
      margin-top: 1rem;
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 1rem auto;
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
    }
    select {
      margin: 0.5rem 0 1rem 0;
      padding: 0.5rem;
      font-size: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background: #f1f1f1;
    }
    .btn {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>Faculty Dashboard</strong></div>
    <div>Welcome, Dr Sam P Nakayk</div>
  </header>

  <div class="container">
    <h2>Mark Attendance</h2>

    <label for="section">Select Section:</label>
    <select id="section">
      <option value="CSE-F">CSE - F</option>
      <option value="CSE-G">CSE - G</option>
      <option value="CSE-H">CSE - H</option>
    </select>

    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Present</th>
          <th>Absent</th>
        </tr>
      </thead>
      <tbody id="attendanceTable">
        <!-- Students will be filled by JS -->
      </tbody>
    </table>

    <button class="btn" onclick="submitAttendance()">Submit Attendance</button>
  </div>

  <script>
    // Dummy student list
    const students = [
      { roll: "24BCSI69", name: "krish" },
      { roll: "24BCSH09", name: "Rudra" },
      { roll: "24BCSF98", name: "Preetam" },
      { roll: "24BCSA19", name: "Himesh" },
      { roll: "24BCSI89", name: "Biksah" }
    ];

    // Load students into table
    const tbody = document.getElementById("attendanceTable");
    students.forEach(stu => {
      tbody.innerHTML += `
        <tr>
          <td>${stu.roll}</td>
          <td>${stu.name}</td>
          <td><input type="radio" name="${stu.roll}" value="Present" checked></td>
          <td><input type="radio" name="${stu.roll}" value="Absent"></td>
        </tr>
      `;
    });

    function submitAttendance() {
      let result = [];
      students.forEach(stu => {
        const status = document.querySelector('input[name="'+stu.roll+'"]:checked').value;
        result.push(`${stu.roll} - ${stu.name}: ${status}`);
      });
      alert("Attendance Submitted:\n" + result.join("\n"));
    }
  </script>
</body>
</html>
